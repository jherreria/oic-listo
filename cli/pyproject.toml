[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oic-listo"
version = "0.1.0"
description = "CLI to securely list Oracle OIC Gen3 Integrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
oic-listo = "oic_listo.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oic_listo"]

[tool.ruff]
line-length = 100
target-version = "py311"
